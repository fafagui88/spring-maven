# ini untuk konfigurasi application properties
# File: application.properties

# --- Konfigurasi MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/db_spring?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Konfigurasi JPA/Hibernate
# Otomatis buat/update tabel

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Konfigurasi JWT ---
# GANTI DENGAN STRING ACAM MINIMAL 32 KARAKTER (256 bits)
jwt.secret=KunciRahasiaJWTUntukProyekSpringBootAndaYangSangatSangatPanjangDanAmanSekali12345sangatpanjangsekaliyahsehinggaamandanapatdigunakan

# ini untuk expirate token
# simulasi nya => 24 jam dalam milidetik
jwt.expiration=86400000

spring.application.name=spring
server.port=9091
